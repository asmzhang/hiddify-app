# AGP 8.6.0 兼容基线（2026-10-03）。
# 背景：`android/` 与上游 main 逐字一致（AGP 8.6.0），而本机 pub 走镜像
# （PUB_HOSTED_URL=https://pub.flutter-io.cn）解析到的插件版本要求 AGP ≥8.9.1
# （由各 AAR 的 META-INF/.../aar-metadata.properties 决定），于是
# `:app:checkReleaseAarMetadata` 报 7 个 issue、安卓构建即断。根因是依赖漂移，
# 不是 AGP 欠债；冲突双方里一侧已脏（lock），故动 lock 侧，
# 不动刻意与上游保持一致的 android/ 侧。
# 实证：camera-core 1.5.3→8.6.0 OK / 1.6.1→8.9.1 FAIL；browser 1.8.0→1.0.0 OK / 1.9.0→8.9.1 FAIL；
#       core 1.16.0→8.6.0 OK / 1.17.0→8.9.1 FAIL。dynamic_color 1.9.0 另有独立缺陷
#       （build.gradle.kts 用了 kotlin{} 却未应用 Kotlin 插件 → Unresolved reference），1.7.0 正常。
# 前 4 个是直接依赖（已在上面钉死），后 3 个是传递依赖——直接依赖的上界管不住它们，
# 故用 dependency_overrides 精确钉死。
# 升级 AGP（≥8.9.1，需连带升 Gradle）是「有一天该做」，不是现在该做：它破坏
# `android/` 与上游逐字一致的纪律，且需要网络绕行（Gradle wrapper 下载）。
# 验证：`flutter pub get` 后 `git diff pubspec.lock` 只应有 dependency 归类变化
#       （transitive → "direct overridden"），版本号与 sha256 必须不变；
#       `flutter pub upgrade --dry-run` 里这 7 个包必须纹丝不动。
# 仍会被推动的 4 个包（googleapis_auth / pointer_interceptor / jni / jni_flutter）
# 已逐个核查与 AGP 无关：前两个纯 Dart 无 android/ 目录；后两个 android/build.gradle
# 新旧逐行只差 Groovy 赋值语法（group '…' → group = '…'），都无 dependencies 块、
# 不引 androidx，故不经 aar-metadata 检查 ⇒ 不需再钉。
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.27
  shared_preferences_android: 2.4.8
  url_launcher_android: 6.3.15

flutter:
  uses-material-design: true
  assets:
    # - assets/core/geoip.db
    # - assets/core/geosite.db
    # 内核版本来源（构建期单一来源）：core.version=...
    - dependencies.properties
    - assets/images/logo.svg
    - assets/images/tray_icon.ico
    - assets/images/tray_icon.png
    - assets/images/tray_icon_dark.ico
    - assets/images/tray_icon_dark.png
    - assets/images/tray_icon_connected.ico
    - assets/images/tray_icon_connected.png
    - assets/images/tray_icon_disconnected.ico
    - assets/images/tray_icon_disconnected.png
    - assets/images/connect_norouz.PNG
    - assets/images/disconnect_norouz.PNG
    - assets/images/world_map.png
    - assets/images/source/ic_launcher_border.png

  fonts:
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
    # - family: Roboto
    #   fonts:
    #     - asset: assets/fonts/Roboto.ttf
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/source/ic_launcher_splash.png
  android_gravity: center
  android_12:
    color: "#ffffff"
    image: assets/images/source/ic_launcher_foreground.png

ffigen:
  name: "HiddifyCoreNativeLibrary"
  description: "Bindings to Hiddify Core Library"
  output: "lib/gen/hiddify_core_generated_bindings.dart"
  headers:
    entry-points:
      - "hiddify-core/bin/desktop.h"

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
  log_level: info
  ignore_missing: true
